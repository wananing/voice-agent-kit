[project]
name = "voice-agent-kit"
version = "0.1.0"
description = "Scaffold for real-time voice agents: turn protocol, output arbiter, tool closure, context/session, trace. Four pipelines: cascade, half-cascade, S2S, full-duplex."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wananing" }]
keywords = ["voice-agent", "speech", "realtime", "asr", "tts", "llm", "barge-in", "turn-detection"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "websockets>=13.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/wananing/voice-agent-kit"
Handbook = "https://github.com/wananing/voice-agent-handbook"

[project.optional-dependencies]
opus = ["opuslib>=3.0.1"]
openai = ["openai>=1.40"]
vad = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10,<2"]

[project.scripts]
vak = "vak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vak"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vak/schemas"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
